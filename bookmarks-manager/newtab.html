<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" type="image/svg+xml" href="chrome.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6.5" cy="6.5" r="5.5"/>
          <line x1="10.5" y1="10.5" x2="15" y2="15"/>
        </svg>
        <input type="text" id="search" placeholder="Search bookmarks..." autocomplete="off" spellcheck="false">
      </div>
      <button id="add-folder-btn" class="add-folder-btn" title="New folder">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 10v6M9 13h6"/>
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>
        </svg>
      </button>
      <div class="view-toggle">
        <button id="sort-az" class="sort-btn" title="Sort A-Z (off: your own order, drag to arrange)">A-Z</button>
      </div>
      <div class="view-toggle">
        <button id="grid-view" title="Grid view">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
            <rect x="0" y="0" width="8" height="8" rx="2"/>
            <rect x="10" y="0" width="8" height="8" rx="2"/>
            <rect x="0" y="10" width="8" height="8" rx="2"/>
            <rect x="10" y="10" width="8" height="8" rx="2"/>
          </svg>
        </button>
        <button id="compact-view" title="Compact view">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
            <rect x="0" y="0" width="4.5" height="4.5" rx="1"/>
            <rect x="6.75" y="0" width="4.5" height="4.5" rx="1"/>
            <rect x="13.5" y="0" width="4.5" height="4.5" rx="1"/>
            <rect x="0" y="6.75" width="4.5" height="4.5" rx="1"/>
            <rect x="6.75" y="6.75" width="4.5" height="4.5" rx="1"/>
            <rect x="13.5" y="6.75" width="4.5" height="4.5" rx="1"/>
            <rect x="0" y="13.5" width="4.5" height="4.5" rx="1"/>
            <rect x="6.75" y="13.5" width="4.5" height="4.5" rx="1"/>
            <rect x="13.5" y="13.5" width="4.5" height="4.5" rx="1"/>
          </svg>
        </button>
        <button id="list-view" title="List view">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
            <rect x="0" y="2" width="18" height="2" rx="1"/>
            <rect x="0" y="8" width="18" height="2" rx="1"/>
            <rect x="0" y="14" width="18" height="2" rx="1"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="capture-status" class="capture-status hidden">
      <div class="capture-bar">
        <div id="capture-fill" class="capture-fill"></div>
      </div>
      <span id="capture-text">Generating previews...</span>
    </div>

    <nav id="breadcrumbs"></nav>
    <main id="content"></main>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Custom Context Menu -->
  <div id="context-menu" class="context-menu hidden">
    <button data-action="open">Open</button>
    <button data-action="open-tab">Open in New Tab</button>
    <button data-action="copy-url">Copy URL</button>
    <button data-action="new-folder">New Folder</button>
    <button data-action="export">Export Bookmarks</button>
    <div class="ctx-separator"></div>
    <button data-action="refresh-thumb">Refresh Preview</button>
    <button data-action="move-up">Move to Parent Folder</button>
    <button data-action="edit">Edit</button>
    <button data-action="delete" class="danger">Delete</button>
  </div>

  <!-- Edit Dialog -->
  <div id="edit-dialog" class="dialog-overlay hidden">
    <div class="dialog">
      <h3 id="edit-heading">Edit Bookmark</h3>
      <label>
        Name
        <input type="text" id="edit-title" spellcheck="false">
      </label>
      <label id="edit-url-label">
        URL
        <input type="text" id="edit-url" spellcheck="false">
      </label>
      <div class="dialog-actions">
        <button id="edit-cancel">Cancel</button>
        <button id="edit-save">Save</button>
      </div>
    </div>
  </div>

  <script src="bookmark-modal.js"></script>
  <script src="app.js"></script>
</body>
</html>
