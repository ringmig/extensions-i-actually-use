<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Right-Click Rescue settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #e8e8e8;
    }

    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #222;
    }

    .header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .header p {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    /* Current site, one click away — typing a domain by hand was the only way in */
    .current {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 10px 16px;
      border-bottom: 1px solid #222;
    }

    .current-host {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-host span {
      display: block;
      font-size: 10px;
      color: #555;
    }

    .current-btn {
      flex-shrink: 0;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      font: 12px/1 -apple-system, sans-serif;
      color: #ccc;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s;
    }

    .current-btn:hover { background: #333; color: #fff; }
    .current-btn:focus-visible { outline: 2px solid #4a9; outline-offset: 1px; }
    .current-btn[aria-pressed="true"] {
      background: #14261e;
      border-color: #2c5244;
      color: #4a9;
    }

    .list-wrap {
      max-height: 240px;
      overflow-y: auto;
    }

    .list-wrap::-webkit-scrollbar { width: 4px; }
    .list-wrap::-webkit-scrollbar-track { background: transparent; }
    .list-wrap::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .empty {
      padding: 20px 16px;
      font-size: 12px;
      color: #444;
      text-align: center;
    }

    .item {
      display: flex;
      align-items: center;
      padding: 8px 12px 8px 16px;
      border-bottom: 1px solid #1c1c1c;
      gap: 8px;
    }

    .item:last-child { border-bottom: none; }

    .item-host {
      flex: 1;
      font-size: 12px;
      color: #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-remove {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 4px;
      color: #444;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s;
    }

    .item-remove:hover {
      background: #2a1414;
      color: #e05555;
    }

    .add-row {
      display: flex;
      gap: 8px;
      padding: 12px 12px 12px 16px;
      border-top: 1px solid #222;
    }

    .add-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 6px 10px;
      font: 12px/1.4 -apple-system, sans-serif;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-input::placeholder { color: #3a3a3a; }
    .add-input:focus { border-color: #444; }

    .add-btn {
      flex-shrink: 0;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0 12px;
      font: 12px/1 -apple-system, sans-serif;
      color: #ccc;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s;
    }

    .add-btn:hover { background: #333; color: #fff; }
    .add-btn:active { background: #3a3a3a; }

    .status {
      height: 24px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 11px;
      color: #4a9;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .status.visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Right-Click Rescue</h1>
    <p>Disabled on these sites</p>
  </div>

  <div class="current" id="current" hidden>
    <div class="current-host" id="currentHost"></div>
    <button class="current-btn" id="currentBtn" aria-pressed="false"></button>
  </div>

  <div class="list-wrap" id="list"></div>

  <div class="add-row">
    <input class="add-input" id="input" type="text" placeholder="example.com" spellcheck="false" />
    <button class="add-btn" id="addBtn">Add</button>
  </div>

  <div class="status" id="status">Saved</div>

  <script src="popup.js"></script>
</body>
</html>
