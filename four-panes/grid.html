<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Four Panes</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  main { display: grid; grid-template: 1fr 1fr / 1fr 1fr; height: 100vh; }
  .cell { position: relative; min-width: 0; min-height: 0; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  form { position: absolute; inset: 0 0 auto; padding: 10px; display: none; }
  form.open { display: block; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 10px;
    border: 1px solid #fff3; background: #2c2c2e; color: #fff;
    font: 18px system-ui, sans-serif; outline: none; box-shadow: 0 8px 30px #000a;
  }
</style>
</head>
<body>
<main></main>
<script type="module" src="grid.js"></script>
</body>
</html>
