<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Four Panes</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --field: #fff; --line: #d2d2d7; --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --field: #2c2c2e; --line: #3a3a3c; --accent: #0a84ff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--fg); font: inherit; }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .row label { margin: 0; color: var(--fg); font-size: 15px; }
  .row input[type=number] { width: 80px; }
  p.hint { color: var(--muted); font-size: 13px; margin: -8px 0 16px 28px; }
  #status { color: var(--muted); font-size: 13px; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Four Panes</h1>
  <div class="grid">
    <div><label for="p0">Uppe till vänster</label><input type="text" id="p0" spellcheck="false"></div>
    <div><label for="p1">Uppe till höger</label><input type="text" id="p1" spellcheck="false"></div>
    <div><label for="p2">Nere till vänster</label><input type="text" id="p2" spellcheck="false"></div>
    <div><label for="p3">Nere till höger</label><input type="text" id="p3" spellcheck="false"></div>
  </div>
  <div class="row"><input type="number" id="gap" min="0" max="200"><label for="gap">pixlar mellan fönstren</label></div>
  <div class="row"><input type="checkbox" id="bare"><label for="bare">Utan flikrad och adressfält</label></div>
  <p class="hint">Ger mer yta, men Cmd+L och flikar fungerar inte i de fönstren.</p>
  <div id="status" role="status"></div>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
