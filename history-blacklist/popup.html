<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 13px;
    }

    /* ---- Header ---- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #2a2a2a;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .slider { background: #4caf50; }
    .toggle input:checked + .slider::before { transform: translateX(18px); }

    /* ---- Add form ---- */
    .add-form {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a2a;
    }
    .form-row {
      display: flex;
      gap: 8px;
    }
    select {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: #666; }

    input[type="text"] {
      flex: 1;
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]::placeholder { color: #666; }
    input[type="text"]:focus { border-color: #666; }

    button.add-btn {
      background: #fff;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button.add-btn:hover { background: #ddd; }

    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #666;
    }

    /* ---- Rules list ---- */
    .rules-list {
      max-height: 300px;
      overflow-y: auto;
    }
    .rules-list::-webkit-scrollbar { width: 4px; }
    .rules-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

    .rule-item {
      display: flex;
      align-items: center;
      padding: 9px 16px;
      border-bottom: 1px solid #222;
      gap: 10px;
    }
    .rule-item:hover { background: #222; }

    .rule-type {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 3px;
      background: #333;
      color: #999;
      flex-shrink: 0;
    }
    .rule-type.keyword { color: #81c784; background: #1b3a1b; }
    .rule-type.domain { color: #64b5f6; background: #1a2a3a; }
    .rule-type.regex { color: #ffb74d; background: #3a2a1a; }

    .rule-pattern {
      flex: 1;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button.delete-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    button.delete-btn:hover { color: #f44336; }

    /* ---- Empty state ---- */
    .empty {
      padding: 30px 16px;
      text-align: center;
      color: #555;
      font-size: 12px;
    }

    /* ---- Footer ---- */
    .footer {
      padding: 8px 16px;
      border-top: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer .count { font-size: 11px; color: #666; }
    button.clear-btn {
      background: none;
      border: 1px solid #3a3a3a;
      color: #999;
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    button.clear-btn:hover { border-color: #f44336; color: #f44336; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>History Blacklist</h1>
    <label class="toggle">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- Add rule form -->
  <div class="add-form">
    <div class="form-row">
      <select id="ruleType">
        <option value="keyword">Keyword</option>
        <option value="domain">Domain</option>
        <option value="regex">Regex</option>
      </select>
      <input type="text" id="rulePattern" placeholder="Enter keyword, domain, or regex...">
      <button class="add-btn" id="addBtn">Add</button>
    </div>
    <div class="hint" id="hint">Matches any URL containing this text</div>
  </div>

  <!-- Rules list -->
  <div class="rules-list" id="rulesList"></div>

  <!-- Footer -->
  <div class="footer">
    <span class="count" id="count">0 rules</span>
    <button class="clear-btn" id="clearBtn">Clear history now</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
