<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 320px;
    max-height: 400px;
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    overflow-y: auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    background: #1a1a1a;
  }
  .header h1 { font-size: 13px; font-weight: 600; }
  .clear-btn {
    font-size: 11px;
    color: #888;
    background: none;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .clear-btn:hover { color: #fff; border-color: #666; }
  .empty {
    padding: 32px 16px;
    text-align: center;
    color: #666;
  }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid #2a2a2a;
  }
  .item:last-child { border-bottom: none; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
  }
  .dot.processing {
    background: #4A90D9;
    animation: pulse 1s infinite;
  }
  .dot.downloading {
    background: #4A90D9;
    animation: pulse 1s infinite;
  }
  .dot.done { background: #4CAF50; }
  .dot.error { background: #F44336; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .info { flex: 1; min-width: 0; }
  .filename {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-text {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-text.error { color: #F44336; }
  .time { font-size: 10px; color: #555; flex-shrink: 0; margin-top: 2px; }
</style>
</head>
<body>
  <div class="header">
    <h1>Media Downloader</h1>
    <button class="clear-btn" id="clear">Clear</button>
  </div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
