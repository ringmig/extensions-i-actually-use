<!DOCTYPE html>
<html>
<head><title>Generate Transcribe Icons</title></head>
<body>
<h2>Right-click each icon → "Save image as..." to icons/ folder</h2>
<p>Or just click the download links below each icon.</p>
<div id="icons" style="display: flex; gap: 40px; align-items: end; margin: 40px;"></div>
<script>
const sizes = [16, 48, 128];
const container = document.getElementById('icons');

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background - rounded rect
  const r = size * 0.18;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fillStyle = '#1a1a1a';
  ctx.fill();

  // "T" letter
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `bold ${size * 0.65}px -apple-system, system-ui, sans-serif`;
  ctx.fillText('T', size / 2, size / 2 + size * 0.03);

  // Small caption lines at bottom
  const lineY = size * 0.82;
  const lineH = Math.max(1, size * 0.04);
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(size * 0.2, lineY, size * 0.6, lineH);
  ctx.fillRect(size * 0.3, lineY + lineH * 2.5, size * 0.4, lineH);

  const div = document.createElement('div');
  div.style.textAlign = 'center';

  const img = new Image();
  img.src = canvas.toDataURL('image/png');
  img.style.border = '1px solid #ccc';
  img.style.imageRendering = 'pixelated';
  img.style.width = Math.max(size, 64) + 'px';
  div.appendChild(img);

  const label = document.createElement('p');
  label.textContent = `icon${size}.png`;
  div.appendChild(label);

  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = `icon${size}.png`;
  link.textContent = 'Download';
  link.style.display = 'block';
  div.appendChild(link);

  container.appendChild(div);
});
</script>
</body>
</html>
